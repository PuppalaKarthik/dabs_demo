# This is a Databricks asset bundle definition for databricks_dabs.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_dabs
  uuid: 82876cb7-dab9-491d-84a4-f95e25d97f0a

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: http://127.0.0.1:7073

  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/pkarthik772@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/pkarthik772@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: pkarthik772@gmail.com
        level: CAN_MANAGE
